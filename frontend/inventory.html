<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMShop — Inventory Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
</head>
<body class="app-body">

    <!-- Header Navigation -->
    <header class="topbar">
        <a href="manager-dashboard.html" class="topbar-brand">
            <div class="brand-logo-icon" style="width:34px;height:34px;font-size:1rem;">RM</div>
            <div class="topbar-logo">RMShop</div>
            <span class="topbar-tag">Inventory</span>
        </a>
        <div class="topbar-user">
            <div class="user-profile-badge">
                <div class="user-avatar-circle">M</div>
                <span id="welcome-name">Manager</span>
            </div>
            <a href="#" id="logout-link" class="logout-link">
                <span>Log out</span>
                <span>↳</span>
            </a>
        </div>
    </header>

    <main class="page">
        <div class="page-header">
            <a href="manager-dashboard.html" class="back-link">← Dashboard</a>
            <h1 class="page-title">Inventory Catalog</h1>
            <button class="btn-primary btn-inline" id="add-product-btn">＋ Add Product</button>
        </div>

        <div class="data-table-container">
            <table class="data-table" id="products-table">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Current Stock</th>
                        <th>Unit Price</th>
                        <th>Stock Health</th>
                        <th class="actions-cell">Actions</th>
                    </tr>
                </thead>
                <tbody id="products-body"></tbody>
            </table>
            <p id="empty-state" class="empty-state" hidden>No products in inventory yet. Add your first item above.</p>
        </div>
    </main>

    <!-- Add Product Modal -->
    <div class="modal-backdrop" id="add-product-modal" hidden>
        <div class="modal">
            <h2>Add New Product</h2>
            <form id="add-product-form">
                <label>Product Name
                    <input type="text" id="new-product-name" placeholder="e.g. Arabica Roast Coffee 500g" required>
                </label>
                <label>Starting Quantity
                    <input type="number" id="new-product-quantity" min="0" value="0" required>
                </label>
                <label>Selling Price ($)
                    <input type="number" id="new-product-price" min="0" step="0.01" placeholder="0.00" required>
                </label>
                <p class="modal-error" id="add-product-error" hidden></p>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" data-close-modal>Cancel</button>
                    <button type="submit" class="btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Restock Modal -->
    <div class="modal-backdrop" id="restock-modal" hidden>
        <div class="modal">
            <h2>Restock <span id="restock-product-name" style="color:var(--cyan-accent);"></span></h2>
            <form id="restock-form">
                <input type="hidden" id="restock-product-id">
                <label>Quantity Added
                    <input type="number" id="restock-quantity" min="1" placeholder="e.g. 50" required>
                </label>
                <label>Wholesale Batch Cost ($)
                    <input type="number" id="restock-cost" min="0" step="0.01" placeholder="0.00" required>
                </label>
                <p class="modal-error" id="restock-error" hidden></p>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" data-close-modal>Cancel</button>
                    <button type="submit" class="btn-primary">Confirm Restock</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Thresholds Modal -->
    <div class="modal-backdrop" id="thresholds-modal" hidden>
        <div class="modal">
            <h2>Alert Thresholds: <span id="thresholds-product-name" style="color:var(--cyan-accent);"></span></h2>
            <form id="thresholds-form">
                <input type="hidden" id="thresholds-product-id">
                <label>Low Stock Warning (at or below)
                    <input type="number" id="thresholds-low" min="0" required>
                </label>
                <label>Critical Stock Level (at or below)
                    <input type="number" id="thresholds-critical" min="0" required>
                </label>
                <p class="modal-error" id="thresholds-error" hidden></p>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" data-close-modal>Cancel</button>
                    <button type="submit" class="btn-primary">Save Thresholds</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script>requireManager();</script>
    <script src="js/inventory.js"></script>
</body>
</html>
