<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMShop — Intelligent Retail Management & POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
    <div class="login-wrapper">
        <!-- Left photo panel -->
        <div class="brand-panel photo-panel photo-card-tap" role="img" aria-label="A customer paying by tapping a card on a card terminal">
            <div class="brand-header">
                <div class="brand-logo-icon">RM</div>
                <div class="brand-logo-text">RMShop</div>
            </div>

            <div class="brand-hero">
                <h1>Every sale counted.<br><span class="gradient-text">Every shelf accounted for.</span></h1>
                <p>Checkout, stock and sales in one simple place.</p>
            </div>

            <div class="brand-footer">
                <span>© RMShop Retail OS</span>
                <span>Encrypted & Audited</span>
            </div>
        </div>

        <!-- Right Login & Keypad Panel -->
        <div class="form-panel">
            <div class="form-content" id="form-container">
                <div class="form-header">
                    <h2>Staff Authentication</h2>
                    <p class="subtitle">Enter your 6-digit terminal access code</p>
                </div>

                <form id="login-form" novalidate>
                    <div class="code-inputs" id="code-inputs">
                        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" autofocus aria-label="Digit 1">
                        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digit 2">
                        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digit 3">
                        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digit 4">
                        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digit 5">
                        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digit 6">
                    </div>

                    <p id="error-message" class="error-message" hidden role="alert"></p>

                    <!-- Interactive On-Screen POS Numpad -->
                    <div class="pos-numpad" id="pos-numpad" aria-label="Virtual Keypad">
                        <button type="button" class="numpad-key" data-digit="1">1</button>
                        <button type="button" class="numpad-key" data-digit="2">2</button>
                        <button type="button" class="numpad-key" data-digit="3">3</button>
                        <button type="button" class="numpad-key" data-digit="4">4</button>
                        <button type="button" class="numpad-key" data-digit="5">5</button>
                        <button type="button" class="numpad-key" data-digit="6">6</button>
                        <button type="button" class="numpad-key" data-digit="7">7</button>
                        <button type="button" class="numpad-key" data-digit="8">8</button>
                        <button type="button" class="numpad-key" data-digit="9">9</button>
                        <button type="button" class="numpad-key key-action" data-action="clear" title="Clear all">CLEAR</button>
                        <button type="button" class="numpad-key" data-digit="0">0</button>
                        <button type="button" class="numpad-key key-action" data-action="backspace" title="Delete last digit">⌫</button>
                    </div>

                    <button type="submit" id="login-btn" class="btn-primary">
                        <span class="btn-text">Unlock Terminal</span>
                        <span class="btn-spinner" hidden></span>
                    </button>
                </form>

                <div style="text-align:center;">
                    <a href="forgot-password.html" class="forgot-link" id="forgot-link">Forgot access code? (Managers)</a>
                </div>
                <p class="footnote">Cashiers: ask your store manager to reset your code.</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
