# Tests run against an in-memory database, never the live Supabase data.
spring.datasource.url=jdbc:h2:mem:rmshop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
rmshop.mail.brevo-api-key=
