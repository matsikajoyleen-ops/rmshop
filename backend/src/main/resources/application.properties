spring.application.name=rmshop

# Supabase Postgres connection (Session pooler, IPv4-compatible).
# The password is never stored here: set SPRING_DATASOURCE_PASSWORD in the
# environment (Render dashboard in production, your shell when running locally).
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.cfbqnseyraywennzqzyo
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The original tables were created by hand, so Hibernate never creates or
# alters them. Newer columns/tables are added by db/migration.sql, which only
# uses IF NOT EXISTS statements and is safe to run on every startup.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration.sql

# Uses the host's assigned port when deployed; falls back to 8080 locally,
# where no PORT variable is set
server.port=${PORT:8080}

# Password-reset emails go out through Brevo's HTTP API (Render's free tier
# blocks outgoing SMTP). With no API key set, emails are written to the server
# log instead, which is only meant for local development.
rmshop.mail.brevo-api-key=${BREVO_API_KEY:}
rmshop.mail.from-email=${MAIL_FROM_EMAIL:}
rmshop.mail.from-name=${MAIL_FROM_NAME:RMShop}
